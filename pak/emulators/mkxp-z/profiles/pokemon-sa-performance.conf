# Restart the game after changing settings. Use enabled=off to disable this profile.
enabled=on
# Hide character foot shadows and dynamic character projections.
shadows=off
# Fuse Essentials + MakerStudio tile position updates, preserving transforms.
tile_coordinates=on
# Reuse tile-loop bookkeeping and fetch map data once per visible map.
batched_tiles=on
# Avoid full key-array scans for successful Symbol/Integer dictionary lookups.
hash_lookup=on
# During Q acceleration, prepare map sprites only for the next displayed frame.
speedup_render=on
